name: Publish

on:
  # CD runs when a Release is published (created by release.yml).
  release:
    types: [published]
  # Manual dry-run / targeted publish.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview only — validate and inspect without publishing'
        type: boolean
        default: true
      plugin:
        description: 'Publish only this plugin (directory name); empty = all'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.list.outputs.plugins }}
      any: ${{ steps.list.outputs.any }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Resolve plugin matrix
        id: list
        env:
          FILTER: ${{ inputs.plugin }}
        run: |
          set -euo pipefail
          PLUGINS="$(bun scripts/list-plugins.mjs --matrix --filter "$FILTER")"
          PLUGINS="${PLUGINS:-[]}"
          {
            echo "plugins<<PLUGINS_JSON"
            echo "$PLUGINS"
            echo "PLUGINS_JSON"
          } >> "$GITHUB_OUTPUT"
          if [ "$PLUGINS" = "[]" ]; then
            echo "any=false" >> "$GITHUB_OUTPUT"
          else
            echo "any=true" >> "$GITHUB_OUTPUT"
          fi

  # Build each plugin and pack the ClawHub artifact. The ClawHub publisher does
  # not run build scripts, so the packed `dist/` must exist before publish.
  build:
    needs: matrix
    if: ${{ needs.matrix.outputs.any == 'true' }}
    runs-on: ubuntu-latest
    name: pack / ${{ matrix.plugin.name }}
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJSON(needs.matrix.outputs.plugins) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build plugin
        run: bun run --cwd "${{ matrix.plugin.dir }}" build

      - name: Pack plugin
        run: |
          set -euo pipefail
          DEST="$RUNNER_TEMP/clawpack/${{ matrix.plugin.name }}"
          mkdir -p "$DEST"
          (cd "${{ matrix.plugin.dir }}" && npm pack --ignore-scripts --pack-destination "$DEST")
          ls -la "$DEST"

      - uses: actions/upload-artifact@v4
        with:
          name: clawpack-${{ matrix.plugin.name }}
          path: ${{ runner.temp }}/clawpack/${{ matrix.plugin.name }}/*.tgz
          if-no-files-found: error

  publish:
    needs: [matrix, build]
    if: ${{ needs.matrix.outputs.any == 'true' }}
    name: publish / ${{ matrix.plugin.name }}
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJSON(needs.matrix.outputs.plugins) }}
    permissions:
      actions: read
      contents: read
      id-token: write
    # Upstream ClawHub CD workflow — validates and publishes the prebuilt
    # ClawPack to ClawHub. Pinned to a reviewed commit of openclaw/clawhub.
    uses: openclaw/clawhub/.github/workflows/package-publish.yml@d871c764f2e50646b37119048d604b5992a81d2c
    with:
      source: ${{ github.repository }}
      source_path: ${{ matrix.plugin.dir }}
      package_artifact_name: clawpack-${{ matrix.plugin.name }}
      version: ${{ matrix.plugin.version }}
      tags: latest
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
      inspector_artifact_name: plugin-inspector-${{ matrix.plugin.name }}
      publish_json_artifact_name: clawhub-publish-${{ matrix.plugin.name }}
    secrets:
      clawhub_token: ${{ secrets.CLAWHUB_TOKEN }}
